# Registry of machine-checked results in the SaomNK Lean library.
#
# One entry per headline declaration (lemmas that only serve a proof are not
# listed; `searchnet::lean_declarations()` lists all of them, and Axioms.lean
# audits all of them). Read with `searchnet::lean_registry()`.
#
#   decl         fully qualified Lean name
#   module       Lean module
#   kind         definition | statistic | potential | chain | limit | nash |
#                integrability | mean-field | compute | convention
#   statement    the claim, in words
#   proof_table  step identifiers in inst/proofs/PROOF_TABLE.md this result
#                underwrites ("M" and "N" are the part-level identifiers for
#                two-layer integrability and the creation/endowment boundary;
#                step numbers inside those parts are assigned by the table)
#   tests        testthat files that exercise the same claim numerically
#   r_functions  R functions whose behavior the result concerns
#
# Every declaration below depends only on propext, Classical.choice and
# Quot.sound (checked by `searchnet::lean_check()`); none uses sorry or
# native_decide.

version: 1
lean_toolchain: leanprover/lean4:v4.34.0-rc2
mathlib: v4.34.0-rc2

results:

  # --- configurations and the NK landscape ---------------------------------
  - decl: SaomNK.card_config
    module: SaomNK.Core.Config
    kind: definition
    statement: "The configuration space {0,1}^(M x N) has 2^(MN) elements."
    proof_table: [A2, A3]
    tests: []
    r_functions: []
  - decl: SaomNK.card_config_gt
    module: SaomNK.Core.Config
    kind: definition
    statement: "For M >= 2 and N >= 1 the multi-actor state space is strictly larger than NK's."
    proof_table: [D3]
    tests: []
    r_functions: []
  - decl: SaomNK.isKRegular_zero_iff
    module: SaomNK.NK.Influence
    kind: definition
    statement: "K = 0 regularity holds iff the influence pattern is the identity."
    proof_table: [A5, A6]
    tests: [tests/testthat/test-nk-classic.R]
    r_functions: [nk_dependencies, nk_landscape]
  - decl: SaomNK.isKRegular_full_iff
    module: SaomNK.NK.Influence
    kind: definition
    statement: "K = N - 1 regularity holds iff every component influences every component."
    proof_table: [A5, A6]
    tests: [tests/testthat/test-nk-classic.R]
    r_functions: [nk_dependencies, nk_landscape]
  - decl: SaomNK.nkTermFull_eq_mul_nkFitness
    module: SaomNK.NK.Fitness
    kind: definition
    statement: "The NK term sum_d f_d(b masked by E_d) is N times NK fitness."
    proof_table: [A7, A8]
    tests: [tests/testthat/test-nk-equivalence.R]
    r_functions: [nk_fitness]
  - decl: SaomNK.heldOnly_eq_full_of_vanishing
    module: SaomNK.NK.Fitness
    kind: definition
    statement: "If each payoff vanishes when its own component is off, the held-only NK term equals the full NK term."
    proof_table: [B2]
    tests: []
    r_functions: []
  - decl: SaomNK.nkTermFull_in_dummy_span
    module: SaomNK.NK.Fitness
    kind: definition
    statement: "Any NK term is an exact linear combination of masked-configuration dummies."
    proof_table: [E2]
    tests: []
    r_functions: []
  - decl: SaomNK.codeLSB_eq_sum
    module: SaomNK.NK.PowerKey
    kind: convention
    statement: "The LSB code of a row is sum_j b_j 2^j; the engine's landscape table row is 1 + sum_d b_d 2^(d-1)."
    proof_table: [A10, B3]
    tests: [tests/testthat/test-lean.R]
    r_functions: [SaomNkRSienaBiEnv$compute_formal_utility]
  - decl: SaomNK.codeMSB_eq_sum
    module: SaomNK.NK.PowerKey
    kind: convention
    statement: "The MSB code is the classical power key sum_j b_j 2^(N-1-j)."
    proof_table: [A9, B3]
    tests: [tests/testthat/test-lean.R, tests/testthat/test-nk-classic.R]
    r_functions: [nk_code, nk_bits, SaomNkRSienaBiEnv$power_key_index]
  - decl: SaomNK.codeEquiv
    module: SaomNK.NK.PowerKey
    kind: convention
    statement: "The LSB code is a bijection between rows and Fin (2^N)."
    proof_table: [A9]
    tests: []
    r_functions: []
  - decl: SaomNK.tableRowSum_enumerate
    module: SaomNK.NK.Table
    kind: convention
    statement: "Enumerating a raw power-key payoff table reproduces the NK term at every configuration."
    proof_table: [A10]
    tests: []
    r_functions: [SaomNkRSienaBiEnv$fitness_landscape]
  - decl: SaomNK.nkTermFull_tableLookup
    module: SaomNK.NK.Table
    kind: convention
    statement: "For a table consistent with the influence pattern, the row sum is the NK term."
    proof_table: [A10]
    tests: [tests/testthat/test-lean.R]
    r_functions: [lean_export_model]

  # --- reduction ----------------------------------------------------------------
  - decl: SaomNK.utility_eq_nkFitness
    module: SaomNK.NK.Reduction
    kind: limit
    statement: "Under one actor, E = G and zero network coefficients, the utility equals N times NK fitness."
    proof_table: [C1, C2, C3, C6]
    tests: [tests/testthat/test-nk-equivalence.R]
    r_functions: [nk_to_saomnk, nk_verify_reduction]
  - decl: SaomNK.logitProb_tendsto_one
    module: SaomNK.Choice.Limits
    kind: limit
    statement: "As beta grows, a unique improving best flip is chosen with probability tending to one."
    proof_table: [C4, C8, C9]
    tests: [tests/testthat/test-nk-equivalence.R]
    r_functions: [SaomNkRSienaBiEnv$compute_choice_probabilities, nk_walk]
  - decl: SaomNK.stayProb_tendsto_one
    module: SaomNK.Choice.Limits
    kind: limit
    statement: "As beta grows with every change negative, no-change has probability tending to one (local optimum)."
    proof_table: [C8, C9]
    tests: [tests/testthat/test-nk-equivalence.R]
    r_functions: [SaomNkRSienaBiEnv$compute_choice_probabilities]
  - decl: SaomNK.improvementStep_is_saom_limit
    module: SaomNK.Choice.Limits
    kind: limit
    statement: "One-flip improvement search on any payoff profile is the zero-noise limit of single-flip SAOM search (Metropolis)."
    proof_table: [C9]
    tests: []
    r_functions: [nk_walk]
  - decl: SaomNK.logitProb_pos
    module: SaomNK.Choice.Logit
    kind: limit
    statement: "At finite beta every flip, improving or not, has positive probability."
    proof_table: [D2, D5]
    tests: []
    r_functions: [SaomNkRSienaBiEnv$compute_choice_probabilities]

