    proof_table: []
    tests: []
    r_functions: []
  - decl: SaomNK.flipPotential_unique
    module: SaomNK.Chain.Reachable
    kind: potential
    statement: "Two exact potentials of the same profile differ by a constant."
    proof_table: [F1]
    tests: []
    r_functions: []

  # --- equilibria ------------------------------------------------------------------
  - decl: SaomNK.exists_nash_of_exactPotential
