# SearchNet Manim Configuration
# ==============================
# Place this file alongside scenes or use: manim --config_file manim.cfg

[CLI]
# Dark background matching SearchNet branding
background_color = #0f1729

# Default to high quality
quality = high_quality

# Output directory
media_dir = ./media

# Disable the manim progress bar in batch mode
# progress_bar = none


# ─────────────────────────────────────────────────────────────────
# Quality Presets
# ─────────────────────────────────────────────────────────────────
# Use with: manim -ql (low), -qm (medium), -qh (high), -qk (4K)
#
#   Low (480p15):   manim -ql scene_k4_evolution.py K4EvolutionScene
#   Medium (720p30): manim -qm scene_k4_evolution.py K4EvolutionScene
#   High (1080p60):  manim -qh scene_k4_evolution.py K4EvolutionScene
#   4K (2160p60):    manim -qk scene_k4_evolution.py K4EvolutionScene

[low_quality]
frame_rate = 15
pixel_height = 480
pixel_width = 854

[medium_quality]
frame_rate = 30
pixel_height = 720
pixel_width = 1280

[high_quality]
frame_rate = 60
pixel_height = 1080
pixel_width = 1920

[fourk_quality]
frame_rate = 60
pixel_height = 2160
pixel_width = 3840
