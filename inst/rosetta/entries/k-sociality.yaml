schema_version: "1"
id: k-sociality
title: "{K} Sociality (actor to actor): rivalry and crowding"
model: Rivalry, crowding and network externalities
citations:
  - key: katz_shapiro_1985
    text: "Katz, M. L., and Shapiro, C. (1985). Network externalities, competition, and compatibility. American Economic Review, 75(3), 424-440."
    doi: ~
  - key: baum_korn_1999
    text: "Baum, J. A. C., and Korn, H. J. (1999). Dynamics of dyadic competitive interaction. Strategic Management Journal, 20(3), 251-278."
    doi: "10.1002/(SICI)1097-0266(199903)20:3<251::AID-SMJ23>3.0.CO;2-H"
relation: translation
statement: >-
  Actor-actor overlap maps to inPop (RSiena's in-degree popularity effect, which
  here reads and moves Sociality, not Popularity): the change statistic of
  adding an activity held by n rivals equals the marginal increase in pairwise
  overlap with them, up to a density shift. A negative coefficient reads as
  crowding, a positive one as agglomeration; four-cycles (cycle4)
  carry repeated contact between pairs of actors.
