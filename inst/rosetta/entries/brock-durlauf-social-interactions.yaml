# Registry entry. Validate with searchnet::rosetta_validate().
schema_version: "1"
id: brock-durlauf-social-interactions
title: Discrete choice with social interactions
model: Brock-Durlauf binary choice with social interactions
citations:
  - key: brock_durlauf_2001
    text: "Brock, W. A., and Durlauf, S. N. (2001). Discrete choice with social interactions. Review of Economic Studies, 68(2), 235-260."
    doi: 10.1111/1467-937X.00168
relation: special-case-linearized
statement: >-
  With many actors, independent components and only a baseline field and a
  peer-adoption term, the stationary mean adoption satisfies the mean-field
  self-consistency m = tanh(beta h + beta J m) of Brock and Durlauf (the
  Curie-Weiss form), with multiple equilibria exactly when beta J > 1 at zero
  field (Property 5 of the proof table). RSiena's two-mode inPop statistic is
  linear in column degree, so the utility carries the coupling exactly
  (theta_inPop = J_b / (M - 1)). The approximation is in the choice rule: the
  RSiena ministep over N toggles and no change gives a per-tie law F_N, which
  matches the binary logit to first order near m = 1/2 after dividing the
  coefficients by kappa_N = 2N / (N + 1) (Property 5 (iii) and Rb2(b) of the
  proof table).
restrictions:
  M: Inf
  "N": null
  W: zero
  beta: null
  revision_rule: single_flip
  rates: constant
  notes:
    - "Rb1: M -> infinity with N fixed"
    - "Rb2: components independent (N = 1, or K = 0 with no other coupling)"
    - "Rb3: social coefficient scaled per neighbor"
    - "Rb4: spin recoding sigma = 2b - 1"
    - "Rb5: finite beta"
