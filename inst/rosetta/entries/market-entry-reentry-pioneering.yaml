statement: >-
  The tie-change event stream separates a firm's first affiliation with a
  component (entry), re-affiliation after exit (re-entry) and the first
  affiliation by any firm (pioneering); re-entry is estimable as entrainment
  (crprod) of B by the cumulative affiliation network, a second, monotone
  dependent network, so memory enters as structure rather than as a covariate.
