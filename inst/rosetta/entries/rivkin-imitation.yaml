schema_version: "1"
id: rivkin-imitation
title: Imitation of complex strategies
model: Rivkin imitation on NK landscapes
citations:
  - key: rivkin_2000
    text: "Rivkin, J. W. (2000). Imitation of complex strategies. Management Science, 46(6), 824-844."
    doi: 10.1287/mnsc.46.6.824.11940
  - key: rivkin_siggelkow_2007
    text: "Rivkin, J. W., and Siggelkow, N. (2007). Patterned interactions in complex systems: Implications for exploration. Management Science, 53(7), 1068-1085."
    doi: 10.1287/mnsc.1060.0626
relation: comparison
statement: >-
  An imitator that copies a successful firm's configuration on an NK landscape
  shares the fitness term with SAOM-NK, but copying a whole configuration is not
  a single-flip choice; the closest SAOM-NK term is the co-holder similarity
  statistic, which attracts an actor to components held by similar performers.
  The two are related, not nested.
restrictions:
